<script>
  window.MathJax = {
    loader: { load: ['[tex]/ams'] },
    tex: {
      packages: { '[+]': ['ams'] },
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']],
      processEscapes: true,
      processEnvironments: true,
      tags: 'ams'
    },
    options: {
      skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
    },
    startup: {
      pageReady: () => {
        // 1. Find all <p> paragraphs containing unrendered \begin{...}
        document.querySelectorAll('p').forEach(p => {
          const text = p.innerHTML.trim();
          if (text.startsWith('\\begin{') && text.endsWith('\\end{') || text.includes('\\begin{equation') || text.includes('\\begin{align')) {
            // 2. Dynamically wrap it in display math delimiters ($$)
            p.innerHTML = '$$' + text + '$$';
          }
        });
        // 3. Trigger MathJax typeset after wrapping
        return MathJax.startup.defaultPageReady();
      }
    }
  };
</script>
<script type="text/javascript" id="MathJax-script" async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
</script>

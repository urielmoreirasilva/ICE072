<script>
  window.MathJax = {
    loader: { load: ['[tex]/ams'] },
    tex: {
      packages: { '[+]': ['ams'] },
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']],
      processEscapes: true,
      processEnvironments: true,
      tags: 'ams'
    },
    options: {
      skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
    },
    startup: {
      pageReady: () => {
        // 1. Scan all paragraph nodes in the document
        const paragraphs = document.querySelectorAll('p');
        paragraphs.forEach(p => {
          let content = p.innerHTML;
          
          // Fix Kramdown backslash stripping for math mode spacing like \! \, \;
          content = content.replace(/\\!/g, '\\!');

          // Detect un-delimited LaTeX environments (equation, equation*, align, gather, etc.)
          if (content.includes('\\begin{') && !content.includes('$$')) {
            // Wrap the environment in $$ display math delimiters for MathJax
            p.innerHTML = '$$' + content + '$$';
          }
        });

        // 2. Pass control back to MathJax to perform the actual rendering
        return MathJax.startup.defaultPageReady();
      }
    }
  };
</script>
<script type="text/javascript" id="MathJax-script" async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
</script>

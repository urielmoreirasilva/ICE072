name: Deploy Jekyll site with Math Jax Fix

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pre-process Raw LaTeX Environments & Inline Commands
        run: |
          # 1. Protect ONLY inline spacing backslashes (\!, \,, \;, \:) from Kramdown stripping
          find . -type f -name "*.md" -exec sed -i -E 's/\$(\\[!,;:]+)\$/\$\\\\\1\$/g' {} +

          # 2. Safely inject $$ around raw equation environments
          find . -type f -name "*.md" -exec sed -i -E 's/^(\\begin\{equation\*?\})/\$\$\n\1/g' {} +
          find . -type f -name "*.md" -exec sed -i -E 's/(\\end\{equation\*?\})/\1\n\$\$/g' {} +

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
